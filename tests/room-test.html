<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Teste do servidor de salas…</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; background: #111; color: #eee; padding: 1rem 1.5rem; }
  code { background: #222; padding: .1em .4em; border-radius: 4px; }
  .ok { color: #5ee0a0; } .bad { color: #ff6a5e; }
  li { margin: .15rem 0; }
</style>
</head>
<body>
<h1>Teste do servidor de salas (<code>relay/worker.js</code>)</h1>
<p>Roda o código <b>real</b> do Worker e do Durable Object com um ambiente de mentira (tudo na memória, sem rede). Na pasta do projeto:
<code>python -m http.server 8000</code>; depois abra <code>http://localhost:8000/tests/room-test.html</code>.</p>
<h2 id="resumo">rodando…</h2>
<ul id="lista"></ul>
<script>
(async function () {
  var resumo = document.getElementById('resumo');
  var lista = document.getElementById('lista');
  try {
    var src = await (await fetch('../relay/worker.js')).text();
    var testSrc = await (await fetch('room-test.js')).text();
    var AsyncFunction = Object.getPrototypeOf(async function () {}).constructor;
    var rep = JSON.parse(await new AsyncFunction('SRC', testSrc)(src));
    rep.results.forEach(function (r) {
      var li = document.createElement('li');
      li.className = r.ok ? 'ok' : 'bad';
      li.textContent = (r.ok ? 'OK  ' : 'FALHOU  ') + r.name + (r.ok ? '' : '  ->  ' + JSON.stringify(r.extra));
      lista.appendChild(li);
    });
    var total = rep.passed + rep.failed;
    resumo.textContent = (rep.failed ? 'FALHOU ' : 'OK ') + rep.passed + '/' + total;
    resumo.className = rep.failed ? 'bad' : 'ok';
    document.title = resumo.textContent;
  } catch (e) {
    resumo.textContent = 'ERRO: ' + e.message;
    resumo.className = 'bad';
    document.title = 'ERRO';
    var pre = document.createElement('pre'); pre.textContent = e.stack; document.body.appendChild(pre);
  }
})();
</script>
</body>
</html>
