name: Release

# Ao enviar uma tag "v*" (por exemplo v1.0.1), o GitHub compila o programa e publica
# o .zip na aba Releases. Nada de segredo: usa so o token que o proprio GitHub fornece.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # a atualizacao automatica recusa um pacote cuja versao interna nao e a da tag: melhor falhar aqui
      - name: Conferir que a versao do codigo e a da tag sao a mesma
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          asm=$(sed -n 's/.*AssemblyVersion("\([0-9.]*\)").*/\1/p' src/Program.cs | head -n 1)
          file=$(sed -n 's/.*AssemblyFileVersion("\([0-9.]*\)").*/\1/p' src/Program.cs | head -n 1)
          ps=$(sed -n "s/^\$version *= *'\([0-9.]*\)'.*/\1/p" build.ps1 | head -n 1)
          echo "tag=$tag AssemblyVersion=$asm AssemblyFileVersion=$file build.ps1=$ps"
          if [ "$asm" != "$tag.0" ] || [ "$file" != "$tag.0" ] || [ "$ps" != "$tag" ]; then
            echo "::error::A versao do codigo nao bate com a tag $GITHUB_REF_NAME. Corrija build.ps1 e src/Program.cs."
            exit 1
          fi

      - name: Compilar e empacotar
        shell: powershell
        run: ./build.ps1 -Package

      - name: Publicar o release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip=$(ls dist/LM-Mini-Player-*-win-x64.zip | head -n 1)
          sha=$(sha256sum "$zip" | cut -d' ' -f1 | tr 'a-f' 'A-F')
          # "O que mudou": a secao desta versao no CHANGELOG.md
          CHANGES="$(awk -v tag="$GITHUB_REF_NAME" '$0 ~ "^## " tag "( |$)" { f=1; next } /^## / { f=0 } f' CHANGELOG.md)"
          export CHANGES
          sed -e "s/{{VERSION}}/${GITHUB_REF_NAME}/g" -e "s/{{SHA256}}/${sha}/g" .github/release-notes.md \
            | awk '{ line = $0; sub(/\r$/, "", line); if (line == "{{CHANGES}}") print ENVIRON["CHANGES"]; else print }' > notes.md
          gh release create "$GITHUB_REF_NAME" "$zip" --title "LM Mini Player ${GITHUB_REF_NAME}" --notes-file notes.md --verify-tag
